<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tradução do Instagram</title>
<style>
  :root{--bg:#0f1115;--card:#181b22;--fg:#e8eaed;--mut:#9aa0aa;--acc:#7c5cff;--ok:#3ddc84;--f:#ff7ac6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;padding:24px}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{color:var(--mut);margin:0 0 20px}
  .card{background:var(--card);border:1px solid #23262f;border-radius:14px;padding:18px;margin-bottom:16px}
  input[type=file]{width:100%;padding:10px;background:#11131a;border:1px dashed #333;border-radius:10px;color:var(--fg)}
  button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;margin-top:12px}
  button:disabled{opacity:.5;cursor:default}
  audio{width:100%;margin-top:8px}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
  td,th{padding:8px;border-bottom:1px solid #23262f;text-align:left;vertical-align:top}
  .g-male{color:#69b3ff}.g-female{color:var(--f)}
  .status{color:var(--mut);margin-top:10px;min-height:20px}
  .badge{display:inline-block;background:#11131a;border:1px solid #2a2e39;border-radius:999px;padding:2px 10px;font-size:12px;color:var(--mut);margin-right:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎧 Tradução do Instagram</h1>
  <p class="sub">Suba um vídeo/áudio em inglês → recebe a dublagem em português, respeitando voz masculina e feminina.</p>

  <div class="card">
    <input id="file" type="file" accept="audio/*,video/*">
    <div>
      <button id="go">Traduzir e dublar</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="card" id="result" style="display:none">
    <div id="meta"></div>
    <audio id="player" controls></audio>
    <table id="segs"><thead><tr><th>Tempo</th><th>Voz</th><th>Inglês</th><th>Português</th></tr></thead><tbody></tbody></table>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
$("#go").onclick=async()=>{
  const f=$("#file").files[0];
  if(!f){$("#status").textContent="Escolha um arquivo primeiro.";return;}
  $("#go").disabled=true;$("#result").style.display="none";
  $("#status").textContent="Processando… (transcrever → traduzir → sintetizar). Pode levar alguns segundos.";
  const fd=new FormData();fd.append("file",f);
  try{
    const r=await fetch("/dublar",{method:"POST",body:fd});
    const j=await r.json();
    if(!r.ok){$("#status").textContent="Erro: "+(j.detail||j.error||r.status);$("#go").disabled=false;return;}
    $("#status").textContent="Pronto ✅";
    $("#meta").innerHTML=`<span class="badge">idioma: ${j.language}</span>
      <span class="badge">duração: ${j.duration}s</span>
      <span class="badge">voz feminina: ${j.tts_mode}</span>`;
    const p=$("#player");p.src=j.audio_url+"&t="+Date.now();p.load();
    const tb=$("#segs tbody");tb.innerHTML="";
    j.segments.forEach(s=>{
      const tr=document.createElement("tr");
      tr.innerHTML=`<td>${s.start}–${s.end}s</td>
        <td class="g-${s.gender}">${s.gender==="female"?"feminina":"masculina"}</td>
        <td>${s.en}</td><td>${s.pt}</td>`;
      tb.appendChild(tr);
    });
    $("#result").style.display="block";
  }catch(e){$("#status").textContent="Falha de rede: "+e.message;}
  $("#go").disabled=false;
};
</script>
</body>
</html>
